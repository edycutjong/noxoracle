<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NoxOracle — one ballot splitting into two sealed envelopes over market candles, synthwave">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0015"/><stop offset="0.55" stop-color="#0a0e1a"/><stop offset="1" stop-color="#0b0720"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#f59e0b"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="candleUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="badge"><rect x="24" y="24" width="464" height="464" rx="112"/></clipPath>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <circle cx="256" cy="238" r="152" fill="url(#sun)" opacity="0.5"/>
    <g fill="#0b0720" opacity="0.9"><rect x="104" y="242" width="304" height="8"/><rect x="104" y="264" width="304" height="10"/><rect x="104" y="288" width="304" height="12"/></g>
    <g stroke="#7c3aed" stroke-width="2" opacity="0.4">
      <line x1="256" y1="330" x2="-140" y2="500"/><line x1="256" y1="330" x2="90" y2="500"/><line x1="256" y1="330" x2="256" y2="500"/>
      <line x1="256" y1="330" x2="422" y2="500"/><line x1="256" y1="330" x2="652" y2="500"/>
      <line x1="40" y1="360" x2="472" y2="360"/><line x1="8" y1="392" x2="504" y2="392"/><line x1="-20" y1="432" x2="532" y2="432"/><line x1="-48" y1="480" x2="560" y2="480"/>
    </g>
    <rect x="24" y="327" width="464" height="4" fill="url(#edge)" opacity="0.95" filter="url(#glow)"/>
    <g fill="#fdf3d9">
      <circle cx="96" cy="96" r="2.2" opacity="0.8"/><circle cx="150" cy="150" r="1.6" opacity="0.6"/><circle cx="392" cy="110" r="2" opacity="0.75"/>
      <circle cx="430" cy="176" r="1.5" opacity="0.5"/><circle cx="330" cy="80" r="1.5" opacity="0.6"/><circle cx="196" cy="72" r="1.4" opacity="0.5"/>
    </g>
  </g>

  <g transform="translate(256,296) scale(1.04) translate(-256,-296)">
    <!-- market candles (behind) -->
    <g filter="url(#glow)" opacity="0.95">
      <g stroke="#f59e0b" stroke-width="4"><line x1="176" y1="312" x2="176" y2="392"/></g>
      <rect x="166" y="330" width="20" height="46" rx="3" fill="none" stroke="#fbbf24" stroke-width="4"/>
      <g stroke="#f59e0b" stroke-width="4"><line x1="220" y1="300" x2="220" y2="398"/></g>
      <rect x="210" y="322" width="20" height="60" rx="3" fill="url(#candleUp)"/>
      <g stroke="#f59e0b" stroke-width="4"><line x1="292" y1="306" x2="292" y2="396"/></g>
      <rect x="282" y="344" width="20" height="40" rx="3" fill="none" stroke="#fbbf24" stroke-width="4"/>
      <g stroke="#f59e0b" stroke-width="4"><line x1="336" y1="296" x2="336" y2="388"/></g>
      <rect x="326" y="314" width="20" height="56" rx="3" fill="url(#candleUp)"/>
    </g>

    <!-- two sealed envelopes (the split), over the candles -->
    <g filter="url(#glow)">
      <!-- left (YES) -->
      <g transform="translate(202,232) rotate(-10)">
        <rect x="-62" y="-42" width="124" height="84" rx="10" fill="url(#env)" stroke="#a78bfa" stroke-width="3.5"/>
        <path d="M-62 -42 L0 6 L62 -42" fill="none" stroke="#c4b5fd" stroke-width="3.5" stroke-linejoin="round"/>
        <circle cx="0" cy="-2" r="14" fill="#fbbf24"/><path d="M0 -12 l3 6 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 Z" fill="#7c3aed"/>
      </g>
      <!-- right (NO) -->
      <g transform="translate(312,232) rotate(10)">
        <rect x="-62" y="-42" width="124" height="84" rx="10" fill="url(#env)" stroke="#a78bfa" stroke-width="3.5"/>
        <path d="M-62 -42 L0 6 L62 -42" fill="none" stroke="#c4b5fd" stroke-width="3.5" stroke-linejoin="round"/>
        <circle cx="0" cy="-2" r="14" fill="#fbbf24"/><path d="M0 -12 l3 6 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 Z" fill="#7c3aed"/>
      </g>
      <!-- split spark at the seam -->
      <g stroke="#fde68a" stroke-width="5" stroke-linecap="round"><line x1="256" y1="196" x2="256" y2="176"/><line x1="246" y1="186" x2="266" y2="186"/></g>
    </g>
  </g>
</svg>
