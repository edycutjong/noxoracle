version: 2
updates:
  # Root workspace (Hardhat contracts + SDK + tooling); npm covers all workspaces.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Hold major upgrades — they need manual migration; keep patch/minor (incl. security).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
