<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NoxOracle animated mark — one ballot splitting into two sealed envelopes over market candles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0015"/><stop offset="0.55" stop-color="#0a0e1a"/><stop offset="1" stop-color="#0b0720"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#f59e0b"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="candleUp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="15"/></filter>
    <clipPath id="badge"><rect x="24" y="24" width="464" height="464" rx="112"/></clipPath>
    <style>
      @keyframes breathe{0%,100%{opacity:.28}82%{opacity:.66}}
      @keyframes sunbreath{0%,100%{opacity:.4}50%{opacity:.56}}
      @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}
      @keyframes candleflick{0%,100%{opacity:.8}45%{opacity:1}}
      @keyframes strippulse{0%,100%{opacity:.5}50%{opacity:1}}
      .breath{animation:breathe 6s ease-in-out infinite}
      .sunb{animation:sunbreath 6s ease-in-out infinite}
      .tw{animation:twinkle 6s ease-in-out infinite}
      .cf{animation:candleflick 6s ease-in-out infinite}
      .strip{animation:strippulse 6s ease-in-out infinite}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <circle class="sunb" cx="256" cy="238" r="152" fill="url(#sun)"/>
    <g fill="#0b0720" opacity="0.9"><rect x="104" y="242" width="304" height="8"/><rect x="104" y="264" width="304" height="10"/><rect x="104" y="288" width="304" height="12"/></g>
    <g stroke="#7c3aed" stroke-width="2" opacity="0.36">
      <line x1="256" y1="330" x2="-140" y2="500"/><line x1="256" y1="330" x2="90" y2="500"/><line x1="256" y1="330" x2="256" y2="500"/>
      <line x1="256" y1="330" x2="422" y2="500"/><line x1="256" y1="330" x2="652" y2="500"/>
    </g>
    <g fill="#7c3aed">
      <rect x="-60" width="640" height="2.4"><animate attributeName="y" values="330;335;353;385;434;500" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.24;0.34;0.42;0.4;0" keyTimes="0;0.1;0.4;0.7;0.92;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="-60" width="640" height="2.4"><animate attributeName="y" values="330;335;353;385;434;500" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" repeatCount="indefinite" begin="-1.5s"/><animate attributeName="opacity" values="0;0.24;0.34;0.42;0.4;0" keyTimes="0;0.1;0.4;0.7;0.92;1" dur="6s" repeatCount="indefinite" begin="-1.5s"/></rect>
      <rect x="-60" width="640" height="2.4"><animate attributeName="y" values="330;335;353;385;434;500" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" repeatCount="indefinite" begin="-3s"/><animate attributeName="opacity" values="0;0.24;0.34;0.42;0.4;0" keyTimes="0;0.1;0.4;0.7;0.92;1" dur="6s" repeatCount="indefinite" begin="-3s"/></rect>
      <rect x="-60" width="640" height="2.4"><animate attributeName="y" values="330;335;353;385;434;500" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" repeatCount="indefinite" begin="-4.5s"/><animate attributeName="opacity" values="0;0.24;0.34;0.42;0.4;0" keyTimes="0;0.1;0.4;0.7;0.92;1" dur="6s" repeatCount="indefinite" begin="-4.5s"/></rect>
    </g>
    <rect class="strip" x="24" y="327" width="464" height="4" fill="url(#edge)" filter="url(#glow)"/>
    <g fill="#fdf3d9">
      <circle class="tw" cx="96" cy="96" r="2.2"/><circle class="tw" cx="150" cy="150" r="1.6" style="animation-delay:-2s"/><circle class="tw" cx="392" cy="110" r="2" style="animation-delay:-1s"/>
      <circle class="tw" cx="430" cy="176" r="1.5" style="animation-delay:-3s"/><circle class="tw" cx="330" cy="80" r="1.5" style="animation-delay:-4s"/><circle class="tw" cx="196" cy="72" r="1.4" style="animation-delay:-2.5s"/>
    </g>
  </g>

  <!-- glow-breath duplicate -->
  <g class="breath" filter="url(#soft)">
    <rect x="182" y="196" width="148" height="80" rx="12" fill="#7c3aed"/>
    <rect x="210" y="322" width="20" height="60" fill="#f59e0b"/><rect x="326" y="314" width="20" height="56" fill="#f59e0b"/>
  </g>

  <g transform="translate(256,296) scale(1.04) translate(-256,-296)">
    <!-- candles -->
    <g class="cf" filter="url(#glow)">
      <g stroke="#f59e0b" stroke-width="4"><line x1="176" y1="312" x2="176" y2="392"/></g>
      <rect x="166" y="330" width="20" height="46" rx="3" fill="none" stroke="#fbbf24" stroke-width="4"/>
      <g stroke="#f59e0b" stroke-width="4"><line x1="220" y1="300" x2="220" y2="398"/></g>
      <rect x="210" y="322" width="20" height="60" rx="3" fill="url(#candleUp)"/>
      <g stroke="#f59e0b" stroke-width="4"><line x1="292" y1="306" x2="292" y2="396"/></g>
      <rect x="282" y="344" width="20" height="40" rx="3" fill="none" stroke="#fbbf24" stroke-width="4"/>
      <g stroke="#f59e0b" stroke-width="4"><line x1="336" y1="296" x2="336" y2="388"/></g>
      <rect x="326" y="314" width="20" height="56" rx="3" fill="url(#candleUp)"/>
    </g>

    <!-- encrypt ring (seam-safe) -->
    <ellipse cx="256" cy="232" rx="150" ry="96" fill="none" stroke="url(#edge)" stroke-width="3" pathLength="100" stroke-dasharray="100" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0;100;100" keyTimes="0;0.05;0.3;0.66;0.92;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0.9;0;0" keyTimes="0;0.08;0.3;0.66;0.92;1" dur="6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- two envelopes: merged -> split -> merged -->
    <g filter="url(#glow)">
      <!-- LEFT (YES) -->
      <g transform="translate(256,232)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-54 0;-54 0;0 0" keyTimes="0;0.08;0.3;0.82;1" dur="6s" repeatCount="indefinite"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0;0;-10;-10;0" keyTimes="0;0.08;0.3;0.82;1" dur="6s" repeatCount="indefinite"/>
            <rect x="-62" y="-42" width="124" height="84" rx="10" fill="url(#env)" stroke="#a78bfa" stroke-width="3.5"/>
            <path d="M-62 -42 L0 6 L62 -42" fill="none" stroke="#c4b5fd" stroke-width="3.5" stroke-linejoin="round"/>
            <circle cx="0" cy="-2" r="14" fill="#fbbf24">
              <animate attributeName="fill" values="#fbbf24;#fbbf24;#ffffff;#fbbf24;#fbbf24" keyTimes="0;0.32;0.4;0.5;1" dur="6s" repeatCount="indefinite"/>
            </circle>
            <path d="M0 -12 l3 6 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 Z" fill="#7c3aed"/>
            <circle cx="0" cy="-2" r="14" fill="none" stroke="#fde68a" stroke-width="3">
              <animate attributeName="r" values="14;14;40;40" keyTimes="0;0.34;0.5;1" dur="6s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.34;0.4;0.52;1" dur="6s" repeatCount="indefinite"/>
            </circle>
          </g>
        </g>
      </g>
      <!-- RIGHT (NO) -->
      <g transform="translate(256,232)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 0;54 0;54 0;0 0" keyTimes="0;0.08;0.3;0.82;1" dur="6s" repeatCount="indefinite"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0;0;10;10;0" keyTimes="0;0.08;0.3;0.82;1" dur="6s" repeatCount="indefinite"/>
            <rect x="-62" y="-42" width="124" height="84" rx="10" fill="url(#env)" stroke="#a78bfa" stroke-width="3.5"/>
            <path d="M-62 -42 L0 6 L62 -42" fill="none" stroke="#c4b5fd" stroke-width="3.5" stroke-linejoin="round"/>
            <circle cx="0" cy="-2" r="14" fill="#fbbf24">
              <animate attributeName="fill" values="#fbbf24;#fbbf24;#ffffff;#fbbf24;#fbbf24" keyTimes="0;0.32;0.42;0.52;1" dur="6s" repeatCount="indefinite"/>
            </circle>
            <path d="M0 -12 l3 6 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 Z" fill="#7c3aed"/>
            <circle cx="0" cy="-2" r="14" fill="none" stroke="#fde68a" stroke-width="3">
              <animate attributeName="r" values="14;14;40;40" keyTimes="0;0.36;0.52;1" dur="6s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.36;0.42;0.54;1" dur="6s" repeatCount="indefinite"/>
            </circle>
          </g>
        </g>
      </g>
      <!-- split spark at seam -->
      <g stroke="#fde68a" stroke-width="5" stroke-linecap="round">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2;0.28;0.4;1" dur="6s" repeatCount="indefinite"/>
        <line x1="256" y1="200" x2="256" y2="178"/><line x1="245" y1="189" x2="267" y2="189"/>
      </g>
    </g>
  </g>
</svg>
